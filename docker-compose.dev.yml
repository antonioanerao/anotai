services:
  db:
    image: postgres:16-alpine
    container_name: ${DB_CONTAINER_NAME:-anotai_db_dev}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anotai}
      POSTGRES_USER: ${POSTGRES_USER:-anotai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_anotai_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anotai_user} -d ${POSTGRES_DB:-anotai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
      args:
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
    container_name: ${APP_CONTAINER_NAME:-anotai_app_dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run prisma:generate && npm run dev -- -H 0.0.0.0 -p 3000"
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-anotai_user}:${POSTGRES_PASSWORD:-change-me}@${DB_HOST:-db}:5432/${POSTGRES_DB:-anotai}?schema=${DB_SCHEMA:-public}}
      AUTH_SECRET: ${AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      PRIMARY_ADMIN_EMAIL: ${PRIMARY_ADMIN_EMAIL}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - node_modules_anotai_dev:/app/node_modules
      - next_cache_anotai_dev:/app/.next

volumes:
  postgres_data_anotai_dev:
  node_modules_anotai_dev:
  next_cache_anotai_dev:
